# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - WalweroAPI

on:
  push:
    branches:
      - country-filter
  workflow_dispatch:

jobs:
  # Tək job: build + deploy. Əvvəlki build→artifact→deploy sxemi GitHub-ın
  # "Artifact storage quota has been hit" limitinə ilişirdi (2026-10-26);
  # walvero-next workflow-u da artifact-sız tək job-dur.
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4612FC28B72D406FAD36D49F60A95448 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_27870209DCB04B8083E4F97AC31455D9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E964A3A23314431D88114FB548C4804C }}

      # wwwroot/.well-known (App Links / Universal Links) gizli qovluqdur —
      # deploy-dan sonra /.well-known/apple-app-site-association 200 qaytarmalıdır.
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'WalweroAPI'
          slot-name: 'Production'
          package: ${{env.DOTNET_ROOT}}/myapp

      # Köçürmə: yeni Azure hesabı (nadir.ezizov, walvero-rg) — köhnə deploy-dan sonra paralel deploy
      - name: Login to new Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.NEWAZ_CLIENT_ID }}
          tenant-id: ${{ secrets.NEWAZ_TENANT_ID }}
          subscription-id: ${{ secrets.NEWAZ_SUBSCRIPTION_ID }}

      - name: Deploy to new Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'walvero-api'
          package: ${{env.DOTNET_ROOT}}/myapp
